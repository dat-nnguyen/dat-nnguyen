name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          # Custom fire/orange glow theme with transparent background and sleek rounded borders
          options: >-
            user=${{ github.repository_owner }}&
            hide_border=true&
            background=00000000&
            border_radius=12&
            ring=FF4500&
            fire=FF4500&
            currStreakNum=FFFFFF&
            sideNums=FFFFFF&
            currStreakLabel=FF6B35&
            sideLabels=FFA500&
            dates=94A3B8&
            card_width=520
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
